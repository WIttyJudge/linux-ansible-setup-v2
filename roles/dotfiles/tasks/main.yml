---
- name: Clone dotfiles repository
  become: true
  become_user: "{{ effective_user_id | default(ansible_facts.user_id) }}"
  ansible.builtin.git:
    repo: https://github.com/WIttyJudge/dotfiles.git
    dest: "{{ effective_user_dir | default(ansible_facts.user_dir) }}/dotfiles"
    version: main
    update: true
